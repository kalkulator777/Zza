<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рисовашки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="menu">
  <div>
    <div class="logo">РИСО<span>ВАШКИ</span></div>
    <div class="subtitle">Рисуем и угадываем в локальной сети</div>
  </div>

  <div id="error" class="error hidden"></div>

  <div class="panel">
    <div class="label">Как тебя звать</div>
    <input id="nick" class="field" maxlength="16" placeholder="Ник" autocomplete="off">
    <div class="row" style="margin-top:14px">
      <button id="create" class="btn primary" style="flex:1">Создать лобби</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <h2 style="flex:1">Лобби в сети</h2>
      <button id="refresh" class="btn ghost small">Обновить</button>
    </div>
    <div id="lobbies" class="lobby-list">
      <div class="empty">Ищем…</div>
    </div>
  </div>

  <div class="panel">
    <div class="label">Не нашлось? Подключиться по адресу</div>
    <div class="row">
      <input id="manual" class="field" placeholder="192.168.0.15:8770" autocomplete="off">
      <button id="go" class="btn">Вперёд</button>
    </div>
  </div>
</div>
<script type="module" src="/static/js/index.js"></script>
</body>
</html>
