<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Zza</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; padding:0; height:100%; background:#05070c; color:#d8dde5;
               font:14px/1.5 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #c { display:block; position:fixed; inset:0; background:#05070c; cursor:crosshair; }
  .panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           background:#05070c; z-index:10; }
  .card { width:min(560px, calc(100% - 32px)); background:#0d1117; border:1px solid #232a35;
          border-radius:8px; padding:20px 22px; }
  h1 { font-size:22px; margin:0 0 2px; letter-spacing:.04em; }
  .dim { color:#7d8694; }
  .row { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  label { min-width:92px; color:#9aa3b2; }
  input { flex:1 1 140px; min-width:110px; background:#05070c; color:#d8dde5;
          border:1px solid #2b3442; border-radius:5px; padding:7px 9px; font:inherit; }
  button { background:#2b3442; color:#d8dde5; border:1px solid #3a4655; border-radius:5px;
           padding:7px 14px; font:inherit; cursor:pointer; }
  button:hover { background:#36414f; }
  button.primary { background:#2f5d3a; border-color:#3f7a4d; }
  button.primary:hover { background:#376c44; }
  #roomlist, #players { margin-top:6px; border-top:1px solid #1d232d; padding-top:8px;
                        max-height:34vh; overflow:auto; }
  .room { display:flex; justify-content:space-between; align-items:center; gap:10px;
          padding:5px 0; border-bottom:1px solid #161c24; }
  /* Строка состояния одна на все экраны: два элемента с одним id — это
     всегда молча не работающий второй. */
  #status { position:fixed; left:0; right:0; bottom:10px; z-index:20; text-align:center;
            min-height:20px; color:#8b93a1; pointer-events:none; }
  #status.bad { color:#e0736e; }
  #hud { position:fixed; left:8px; top:6px; z-index:5; color:#b9c2d0;
         font:12px/1.5 ui-monospace, Consolas, monospace; text-shadow:0 1px 2px #000;
         pointer-events:none; white-space:pre; }
  #help { position:fixed; left:8px; bottom:30px; z-index:5; color:#68707e;
          font:12px/1.5 ui-monospace, Consolas, monospace; pointer-events:none; }
  #roomCode { font:600 16px/1 ui-monospace, Consolas, monospace; letter-spacing:.18em; }
</style>
</head>
<body>

<!-- Игровой экран -->
<div id="game" style="display:none">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="help">WASD / стрелки — движение · мышь — прицел · ЛКМ или F — удар · ПКМ или R — выстрел · Shift или пробел — рывок · E — действие · Q — предмет</div>
</div>

<!-- Меню -->
<div class="panel" id="menu">
  <div class="card">
    <h1>Zza</h1>
    <p class="dim" style="margin:0 0 14px">Кооперативный рогалик. Играть — в локальной сети, по коду комнаты.</p>
    <div class="row"><label for="name">Имя</label><input id="name" value="Игрок" maxlength="24" autocomplete="off"></div>
    <div class="row">
      <label for="code">Код комнаты</label>
      <input id="code" placeholder="ABCD" maxlength="4" autocomplete="off" spellcheck="false">
      <button id="joinBtn">Войти</button>
    </div>
    <div class="row">
      <button id="createBtn" class="primary">Создать комнату</button>
      <button id="refreshBtn">Обновить список</button>
      <a href="/download" style="margin-left:auto"><button>Скачать папку игры</button></a>
    </div>
    <div id="roomlist"></div>
  </div>
</div>

<!-- Лобби -->
<div class="panel" id="lobby" style="display:none">
  <div class="card">
    <h1>Комната <span id="roomCode">—</span></h1>
    <p class="dim" style="margin:0 0 12px">Игра начнётся, когда готовы все, кто в сети.</p>
    <div id="players"></div>
    <div class="row" style="margin-top:14px">
      <button id="readyBtn" class="primary">Готов</button>
    </div>
  </div>
</div>

<div id="status"></div>

<!-- Клиент всегда отдаётся сервером по HTTP, поэтому ES-модули можно:
     запрет CORS на file:// сюда не относится. -->
<script type="module" src="/static/ui.js"></script>
</body>
</html>
