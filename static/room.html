<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рисовашки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">РИСО<span style="color:var(--accent)">ВАШКИ</span></div>
    <div class="code-chip" id="code">····</div>
    <div id="status" class="round-label"></div>
    <div class="spacer"></div>
    <button id="leave" class="btn ghost small">Выйти</button>
  </div>

  <!-- ===== ЛОББИ ===== -->
  <div id="view-lobby" class="hidden">
    <div class="layout" style="grid-template-columns:260px minmax(0,1fr)">
      <div class="panel">
        <h2>Игроки</h2>
        <div id="lobby-players" class="players" style="margin-top:12px"></div>
      </div>
      <div class="panel settings">
        <h2>Режим</h2>
        <div class="grid" id="mode-cards"></div>
        <h2 style="margin-top:8px">Настройки</h2>
        <div class="grid">
          <label class="only-guess"><div class="label">Кругов</div>
            <input id="s-rounds" class="field" type="number" min="1" max="10"></label>
          <label class="only-album"><div class="label">Ходов в альбоме</div>
            <input id="s-steps" class="field" type="number" min="0" max="12"
                   title="0 — по числу игроков"></label>
          <label><div class="label">Секунд на рисунок</div>
            <input id="s-draw_time" class="field" type="number" min="20" max="180" step="5"></label>
          <label class="only-album"><div class="label">Секунд на подпись</div>
            <input id="s-write_time" class="field" type="number" min="15" max="120" step="5"></label>
          <label class="only-animation"><div class="label">Кадров в секунду</div>
            <input id="s-fps" class="field" type="number" min="1" max="12"></label>
          <label class="only-animation"><div class="label">Общий фон</div>
            <div class="checkline"><input id="s-background" type="checkbox">
              <span>первый ход — фон для всех кадров</span></div></label>
          <label class="only-guess"><div class="label">Подсказок (букв)</div>
            <input id="s-hints" class="field" type="number" min="0" max="3"></label>
          <label class="only-guess"><div class="label">Сложность слов</div>
            <select id="s-difficulty" class="field">
              <option value="easy">Простые</option>
              <option value="mixed">Вперемешку</option>
              <option value="hard">Посложнее</option>
            </select></label>
        </div>
        <label class="only-guess"><div class="label">Свои слова — через запятую (тогда банк не используется)</div>
          <textarea id="s-custom_words" class="field" rows="2" placeholder="необязательно"></textarea></label>
        <div class="row">
          <div id="invite" class="round-label"></div>
          <div class="spacer"></div>
          <button id="start" class="btn primary">Начать</button>
        </div>
        <div id="host-note" class="round-label">Настройки меняет хозяин лобби</div>
      </div>
    </div>
  </div>

  <!-- ===== ИГРА ===== -->
  <div id="view-game" class="hidden">
    <div class="layout">
      <div class="panel"><div id="game-players" class="players"></div></div>

      <div class="stage">
        <div class="stage-head">
          <div class="timer" id="timer">--</div>
          <div class="word" id="word"></div>
          <div class="round-label" id="round"></div>
        </div>
        <div id="source-text" class="source-text hidden"></div>

        <div class="work">
          <div class="canvas-box watching hidden" id="source-box">
            <div class="canvas-tag">Было</div>
            <canvas id="source"></canvas>
          </div>
          <div class="canvas-box watching" id="canvas-box">
            <canvas id="board"></canvas>
            <div class="overlay hidden" id="overlay"></div>
          </div>
        </div>
        <div class="tools hidden" id="tools">
          <button class="btn small tool active" data-tool="pen">Карандаш</button>
          <button class="btn small tool" data-tool="eraser">Ластик</button>
          <button class="btn small tool" data-tool="fill">Заливка</button>
          <div class="sizes" id="sizes"></div>
          <div class="swatches" id="swatches"></div>
          <div class="tool-actions">
            <button class="btn small" id="undo">Отменить</button>
            <button class="btn small" id="clear">Очистить</button>
          </div>
        </div>

        <div class="album-bar hidden" id="album-bar">
          <input id="album-text" class="field hidden" maxlength="140" placeholder="Пиши фразу…" autocomplete="off">
          <div id="album-note" class="round-label"></div>
          <div class="spacer"></div>
          <button id="submit" class="btn primary hidden">Готово</button>
          <button id="next" class="btn ghost hidden">Дальше</button>
        </div>
      </div>

      <div class="chat-col panel">
        <div class="chat-log" id="chat"></div>
        <input id="chat-input" class="field" placeholder="Пиши догадку…" maxlength="200" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- ===== ИТОГИ ===== -->
  <div id="view-results" class="panel hidden">
    <h1 style="text-align:center">Итоги</h1>
    <div class="results-table" id="results" style="margin-top:18px"></div>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button id="again" class="btn primary">Ещё разок</button>
    </div>
  </div>
</div>
<script type="module" src="/static/js/room.js"></script>
</body>
</html>
